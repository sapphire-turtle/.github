name: Release binary

# Builds one binary for the four release platforms and attaches it to an
# existing GitHub release as `<asset>-<os>-<arch>[.exe]`:
#
#   linux-x86_64, linux-aarch64, macos-aarch64, windows-x86_64.exe
#
# With `sign: true`, each file also gets its minisign signature, `<file>.sig`, made with
# `cargo packager signer sign` and the organization's key (the secrets
# PACKAGER_SIGN_PRIVATE_KEY and PACKAGER_SIGN_PRIVATE_KEY_PASSWORD, as release-packager.yml
# reads them; pass `secrets: inherit`). corundum-framework-update checks it before it installs
# the file, when the app names the public key (`ReleaseSource::pubkey`).
#
# Those names are a contract: `sapphire-framework-update` (the `update` command),
# sapphire-framework's install/install.sh and install.ps1, and each crate's
# `[package.metadata.binstall]` look for them, so do not change them here alone.
#
# Called from a repository's release-plz workflow once the release exists (see
# workflow-templates/release-plz.yml). A tag pushed by a workflow does not start
# other workflows, which is why this is called rather than started by `on: push: tags`.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Existing release tag to attach the binaries to (e.g. v0.19.0).'
        type: string
        required: true
      package:
        description: 'The cargo package to build.'
        type: string
        required: true
      binary:
        description: 'The binary target name, without `.exe`.'
        type: string
        required: true
      asset:
        description: 'The release file name before `-<os>-<arch>`. Defaults to the binary name.'
        type: string
        default: ''
      linux-packages:
        description: 'Extra apt packages to install on Linux, space separated. protoc is always installed.'
        type: string
        default: ''
      pre-build:
        description: 'A bash script run after the cargo cache is restored, before the build.'
        type: string
        default: ''
      post-build:
        description: 'A bash script run after the build, with the built file in $BIN; fail it to keep a broken binary off the release.'
        type: string
        default: ''
      sign:
        description: 'Sign each file with minisign and attach the signature as `<file>.sig`. Needs the PACKAGER_SIGN_PRIVATE_KEY secrets.'
        type: boolean
        default: false
      packager-version:
        description: 'The cargo-packager version that signs, with `sign`.'
        type: string
        default: '0.11.8'
    secrets:
      PACKAGER_SIGN_PRIVATE_KEY:
        required: false
      PACKAGER_SIGN_PRIVATE_KEY_PASSWORD:
        required: false

defaults:
  run:
    shell: bash

jobs:
  build:
    # macOS and Windows are the platforms most likely to break unnoticed; a
    # failure there must not keep the Linux binaries from being uploaded.
    continue-on-error: ${{ matrix.continue-on-error }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            exe: ''
            continue-on-error: false
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            exe: ''
            continue-on-error: false
          - os: macos-latest
            platform: macos-aarch64
            exe: ''
            continue-on-error: true
          - os: windows-latest
            platform: windows-x86_64
            exe: '.exe'
            continue-on-error: true
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # rustup installs the rust-toolchain.toml toolchain on first use.
      - name: Install the pinned toolchain
        run: cargo --version

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        env:
          PACKAGES: ${{ inputs.linux-packages }}
        run: |
          sudo apt-get update
          # Unquoted on purpose: PACKAGES is a list.
          sudo apt-get install -y protobuf-compiler $PACKAGES
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - uses: Swatinem/rust-cache@v2

      - name: Pre-build
        if: inputs.pre-build != ''
        env:
          SCRIPT: ${{ inputs.pre-build }}
        run: eval "$SCRIPT"

      - name: Build
        run: cargo build --release --locked --package "${{ inputs.package }}" --bin "${{ inputs.binary }}"

      - name: Post-build
        if: inputs.post-build != ''
        env:
          SCRIPT: ${{ inputs.post-build }}
          BIN: target/release/${{ inputs.binary }}${{ matrix.exe }}
        run: eval "$SCRIPT"

      - name: Name the release file
        id: asset
        env:
          BIN: target/release/${{ inputs.binary }}${{ matrix.exe }}
          BASE: ${{ inputs.asset != '' && inputs.asset || inputs.binary }}
        run: |
          name="$BASE-${{ matrix.platform }}${{ matrix.exe }}"
          cp "$BIN" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "files=$name" >> "$GITHUB_OUTPUT"

      - uses: cargo-bins/cargo-binstall@main
        if: inputs.sign
      - name: Install cargo-packager
        if: inputs.sign
        run: cargo binstall -y "cargo-packager@${{ inputs.packager-version }}"

      # The signature's trusted comment names the file (`file:<name>`), and the updater
      # checks that, so sign it under the name it is released as.
      - name: Sign the release file
        id: signed
        if: inputs.sign
        env:
          NAME: ${{ steps.asset.outputs.name }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" ]; then
            echo "::error::No PACKAGER_SIGN_PRIVATE_KEY secret: pass secrets: inherit, or leave sign off"
            exit 1
          fi
          cargo packager signer sign "$NAME"
          test -s "$NAME.sig"
          echo "files=$NAME,$NAME.sig" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ inputs.sign && steps.signed.outputs.files || steps.asset.outputs.files }}
